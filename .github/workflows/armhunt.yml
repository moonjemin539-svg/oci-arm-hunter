name: OCI ARM Hunter

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install OCI CLI
        run: |
          python3 -m pip install oci-cli

      - name: Configure OCI
        run: |
          mkdir -p ~/.oci

          cat > ~/.oci/oci_api_key.pem <<'EOF'
          ${{ secrets.OCI_PRIVATE_KEY }}
          EOF

          chmod 600 ~/.oci/oci_api_key.pem

          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=/home/runner/.oci/oci_api_key.pem
          EOF

      - name: Hunt ARM Capacity
        run: |
          ADS=(
            "LojN:US-ASHBURN-AD-1"
            "LojN:US-ASHBURN-AD-2"
            "LojN:US-ASHBURN-AD-3"
          )

          for AD in "${ADS[@]}"
          do
            echo "================================="
            echo "Trying $AD"
            echo "================================="

            oci compute instance launch \
              --availability-domain "$AD" \
              --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
              --subnet-id "${{ secrets.OCI_SUBNET_ID }}" \
              --shape VM.Standard.A1.Flex \
              --shape-config '{"ocpus":1,"memoryInGBs":6}' \
              --image-id "${{ secrets.OCI_IMAGE_ID }}" \
              --display-name armtest \
              --assign-public-ip true \
              --metadata "{\"ssh_authorized_keys\":\"${{ secrets.OCI_SSH_KEY }}\"}" \
              > result.json 2> error.log || true

            echo "===== RESULT ====="
            cat result.json || true

            echo "===== ERROR ====="
            cat error.log || true

            if grep -q '"id"' result.json; then
              echo "🎉 SUCCESS - ARM INSTANCE CREATED"
              cat result.json
              exit 0
            fi
          done

          echo "❌ No capacity available"
          exit 0
